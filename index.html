<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع القرآن الكريم - هاشم || Hashim</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-emerald: #0b4f37;
      --emerald-light: #127c56;
      --accent-gold: #e2b153;
      --gold-bright: #ffd700;
      --bg-dark: #051610;
      --card-bg: rgba(11, 40, 29, 0.75);
      --glass-border: rgba(226, 177, 83, 0.3);
      --text-gold: #f3d085;
      --text-light: #e0e8e4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at top center, #0d3828 0%, #030f0a 100%);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px 60px; }

    /* الهيدر والعرض الشخصي */
    .profile-header { text-align: center; padding: 40px 20px 20px; }

    .avatar-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* حلقة نيون متحركة للملف الشخصي */
    .glow-aura {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,255,136,0.35) 0%, rgba(226,177,83,0.2) 50%, transparent 70%);
      animation: pulseAura 3s infinite alternate ease-in-out;
    }

    @keyframes pulseAura {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.12); opacity: 1; }
    }

    .avatar-ring-outer {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold-bright), #00ff88, var(--accent-gold), #127c56, var(--gold-bright));
      animation: spinRing 4s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      z-index: 2;
      border: 3px solid var(--accent-gold);
      background: #0b281d;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    .profile-title {
      font-family: 'Amiri', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--text-gold);
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .profile-subtitle { font-size: 1.1rem; color: #a3c9b8; margin-bottom: 25px; }

    /* روابط التواصل الاجتماعي */
    .social-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s;
      border: 1px solid var(--glass-border);
    }

    .social-btn:hover { transform: translateY(-3px); }
    .btn-youtube { background: linear-gradient(135deg, #cc0000, #990000); color: white; }
    .btn-instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; }
    .btn-facebook { background: linear-gradient(135deg, #1877f2, #0d52b3); color: white; }

    /* شبكة الفيديوهات */
    .section-title {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      color: var(--text-gold);
      margin: 40px 0 20px;
      text-align: center;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .video-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-gold);
      box-shadow: 0 8px 25px rgba(0, 255, 136, 0.2);
    }

    .thumbnail-box {
      position: relative;
      width: 100%;
      padding-top: 130%;
      background: #000;
    }

    .thumbnail-box img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
    }

    .play-icon {
      width: 50px;
      height: 50px;
      background: rgba(11, 79, 55, 0.9);
      border: 2px solid var(--accent-gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-bright);
      font-size: 1.2rem;
    }

    .video-info { padding: 12px; text-align: center; }
    .video-title { font-size: 1rem; font-weight: 700; color: var(--text-light); }
    .video-author { font-size: 0.8rem; color: var(--text-gold); margin-top: 4px; }

    /* نافذة المشغل المباشر داخل الموقع */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 75vh;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.3);
    }

    .modal-content iframe { width: 100%; height: 100%; border: none; }

    .close-modal {
      position: absolute;
      top: -45px; left: 5px;
      color: white; font-size: 2.2rem; cursor: pointer;
      transition: color 0.3s;
    }
    .close-modal:hover { color: var(--accent-gold); }

    footer { text-align: center; padding: 30px 0; color: #83a797; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="container">
    
    <header class="profile-header">
      <div class="avatar-wrapper">
        <div class="glow-aura"></div>
        <div class="avatar-ring-outer"></div>
        <!-- صورة ثابتة وغير قابلة للتغيير -->
        <img id="profileImage" src="image.png" alt="هاشم" class="avatar-img" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&auto=format&fit=crop';">
      </div>

      <h1 class="profile-title">هاشم || Hashim</h1>
      <p class="profile-subtitle">القناة الرسمية للتلاوات القرآنية الخاشعة</p>

      <div class="social-links">
        <a href="https://youtube.com/@hash.q30?si=C-2Rm5w0u5QZIZiK" target="_blank" class="social-btn btn-youtube"><i class="fab fa-youtube"></i> يوتيوب</a>
        <a href="https://instagram.com/hash.q3o" target="_blank" class="social-btn btn-instagram"><i class="fab fa-instagram"></i> إنستغرام</a>
        <a href="https://web.facebook.com/hashim.frewan?locale=ar_AR" target="_blank" class="social-btn btn-facebook"><i class="fab fa-facebook-f"></i> فيسبوك</a>
      </div>
    </header>

    <h2 class="section-title">تلاوات بصوت القارئ هاشم</h2>
    <div class="videos-grid" id="grid-hashim"></div>

    <h2 class="section-title">تلاوات خاشعة - كبار القراء</h2>
    <div class="videos-grid" id="grid-famous"></div>

    <footer>
      <p>جميع الحقوق محفوظة © موقع القرآن الكريم - القارئ هاشم</p>
    </footer>

  </div>

  <!-- نافذة المشغل المباشر -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <iframe id="youtubeIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const hashimVideos = [
      { id: 'iAk1NCK-j30', title: 'تلاوة خاشعة #1' },
      { id: 'U0CAbmU1ecw', title: 'تلاوة خاشعة #2' },
      { id: 'k7yMWtwf56U', title: 'تلاوة خاشعة #3' },
      { id: '-cWe7VgSuis', title: 'تلاوة خاشعة #4' },
      { id: 'cFhwhQ3Crzc', title: 'تلاوة خاشعة #5' },
      { id: 'Thrz69KA0GQ', title: 'تلاوة خاشعة #6' },
      { id: 'Cad4AXbVpE4', title: 'تلاوة خاشعة #7' },
      { id: 'v4rl6BJW8Jc', title: 'تلاوة خاشعة #8' },
      { id: '77phBKg0V4A', title: 'تلاوة خاشعة #9' }
    ];

    const famousVideos = [
      { id: 'pIeVr_NHNi0', title: 'تلاوة عطرة' },
      { id: '8bMUCLpYpzI', title: 'تلاوة خاشعة' },
      { id: 'joZW-gzWMow', title: 'مقطع قرآني مؤثر' },
      { id: 'r8GrznJO_nk', title: 'تلاوة تريح القلوب' },
      { id: 'Lv7OugBKRxE', title: 'تلاوة رائعة' },
      { id: 'kvVJBHrJPS4', title: 'آيات بينات' },
      { id: 'Eg0OVXjdXg8', title: 'تلاوة مميزة' },
      { id: 'GzXwilgSF58', title: 'راحة نفسية' },
      { id: 'LNpPq5YUU64', title: 'تلاوة عذبة' },
      { id: 'NXpVRs44QOQ', title: 'تلاوة مبكية' }
    ];

    function createCard(video, author) {
      const thumbUrl = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
      return `
        <div class="video-card" onclick="openModal('${video.id}')">
          <div class="thumbnail-box">
            <img src="${thumbUrl}" alt="${video.title}" loading="lazy">
            <div class="play-overlay">
              <div class="play-icon"><i class="fas fa-play"></i></div>
            </div>
          </div>
          <div class="video-info">
            <div class="video-title">${video.title}</div>
            <div class="video-author">${author}</div>
          </div>
        </div>
      `;
    }

    function renderVideos() {
      document.getElementById('grid-hashim').innerHTML = hashimVideos.map(v => createCard(v, 'بصوت القارئ هاشم')).join('');
      document.getElementById('grid-famous').innerHTML = famousVideos.map(v => createCard(v, 'كبار القراء')).join('');
    }

    function openModal(id) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('youtubeIframe');
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&loop=1`;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('youtubeIframe');
      iframe.src = ''; 
      modal.classList.remove('active');
    }

    window.onclick = function(event) {
      const modal = document.getElementById('videoModal');
      if (event.target == modal) { closeModal(); }
    }

    renderVideos();
  </script>
</body>
</html>
